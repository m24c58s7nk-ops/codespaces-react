name: Deploy React app to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Repair missing App.jsx component closure
        run: |
          printf '\n  )\n}\n' >> src/App.jsx

      - name: Fix mobile form sizing
        run: |
          cat >> src/App.css <<'EOF'

          /* Final form containment fix: avoid Safari native control overflow */
          .event-form {
            width: 100% !important;
            max-width: 100% !important;
            min-width: 0 !important;
            padding-left: 20px !important;
            padding-right: 20px !important;
            overflow: hidden !important;
          }

          .event-form *,
          .event-form label,
          .event-form input,
          .event-form textarea,
          .time-grid,
          .time-grid label {
            box-sizing: border-box !important;
            min-width: 0 !important;
            width: 100% !important;
            max-width: 100% !important;
          }

          .event-form input,
          .event-form textarea {
            display: block !important;
            inline-size: 100% !important;
            max-inline-size: 100% !important;
          }

          /* Stack the time fields so neither native iPad control can escape. */
          .time-grid {
            display: flex !important;
            flex-direction: column !important;
            gap: 0 !important;
          }

          .event-form input[type="date"],
          .event-form input[type="time"] {
            appearance: none !important;
            -webkit-appearance: none !important;
            font-size: 16px !important;
            min-inline-size: 0 !important;
          }
          EOF

      - name: Build
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
