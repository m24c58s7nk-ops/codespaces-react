name: Deploy React app to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Add event-specific item assignment
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path("src/App.jsx")
          text = path.read_text()

          text = text.replace(
              '  const [itemLocation, setItemLocation] = useState("")\n',
              '  const [itemLocation, setItemLocation] = useState("")\n  const [selectedItemEventId, setSelectedItemEventId] = useState("")\n'
          )

          text = text.replace(
              '  function addItem() {',
              '  function addItem() {'
          )

          text = text.replace(
              '        location: itemLocation.trim(),\n        grabbed: false',
              '        location: itemLocation.trim(),\n        eventId: selectedItemEventId ? Number(selectedItemEventId) : null,\n        grabbed: false'
          )

          text = text.replace(
              '    setItemLocation("")\n  }\n\n  function toggleItem',
              '    setItemLocation("")\n    setSelectedItemEventId("")\n  }\n\n  function toggleItem'
          )

          text = text.replace(
              '              <span>{items.length}</span>\n            </div>\n\n            {items.length === 0 ? (',
              '              <span>{items.filter(item => item.eventId === selectedEvent.id).length}</span>\n            </div>\n\n            {items.filter(item => item.eventId === selectedEvent.id).length === 0 ? ('
          )

          text = text.replace(
              '                {items.map((item, index) => (',
              '                {items.filter(item => item.eventId === selectedEvent.id).map((item, index) => (',
              1
          )

          marker = '''        <input\n          type="text"\n          placeholder="Where is it usually?"'''
          replacement = '''        <label className="item-event-label">\n          Bring to this event\n          <select\n            value={selectedItemEventId}\n            onChange={e => setSelectedItemEventId(e.target.value)}\n          >\n            <option value="">Choose an event</option>\n            {events.map(event => (\n              <option key={event.id} value={event.id}>\n                {event.name} — {formatEventDate(event.date)}\n              </option>\n            ))}\n          </select>\n        </label>\n\n''' + marker
          text = text.replace(marker, replacement)

          path.write_text(text)
          PY

      - name: Repair missing App.jsx component closure
        run: |
          printf '\n  )\n}\n' >> src/App.jsx

      - name: Fix mobile form sizing
        run: |
          cat >> src/App.css <<'EOF'

          /* Final form containment fix: avoid Safari native control overflow */
          .event-form {
            width: 100% !important;
            max-width: 100% !important;
            min-width: 0 !important;
            padding-left: 20px !important;
            padding-right: 20px !important;
            overflow: hidden !important;
          }

          .event-form *,
          .event-form label,
          .event-form input,
          .event-form textarea,
          .time-grid,
          .time-grid label {
            box-sizing: border-box !important;
            min-width: 0 !important;
            width: 100% !important;
            max-width: 100% !important;
          }

          .event-form input,
          .event-form textarea {
            display: block !important;
            inline-size: 100% !important;
            max-inline-size: 100% !important;
          }

          .time-grid {
            display: flex !important;
            flex-direction: column !important;
            gap: 0 !important;
          }

          .event-form input[type="date"],
          .event-form input[type="time"] {
            appearance: none !important;
            -webkit-appearance: none !important;
            font-size: 16px !important;
            min-inline-size: 0 !important;
          }
          EOF

      - name: Build
        run: npm run build

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
